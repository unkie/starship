# ▄█ ░█░ █▀█ █▀▄ ▄█ █▀█ █ █▀▀

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[█](fg:rose bg:underlay)\
$username\
[@](bg:rose fg:underlay)\
$hostname\
[█](fg:rose bg:overlay)\
$directory\
[](fg:rose bg:overlay)\
$git_branch\
$git_status\
[ ](fg:overlay bg:underlay)\
$fill\
$line_break\
$character\
"""

palette = 'rose-pine'

[fill]
symbol = ' '
style = "bg:underlay"

[username]
show_always = true
style_user = "bg:rose fg:underlay"
style_root = "bold bg:red fg:crust"
format = '[$user]($style)'

[hostname]
disabled = false
ssh_only = false
ssh_symbol = "🌏"
style = "bg:rose fg:underlay"
format = '[$ssh_symbol$hostname]($style)'

[directory]
style = "bg:overlay fg:rose"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"
#"~" = ""

[git_branch]
symbol = ""
style = "bg:overlay"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:overlay"
format = '[$ahead_behind$untracked ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](fg:pine)'
error_symbol = '[❯](fg:love)'
vimcmd_symbol = '[❮](fg:pine)'
vimcmd_replace_one_symbol = '[❮](fg:iris)'
vimcmd_replace_symbol = '[❮](fg:iris)'
vimcmd_visual_symbol = '[❮](fg:gold)'

[palettes.rose-pine]
overlay = '#26233a'
underlay = '#191724'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'

